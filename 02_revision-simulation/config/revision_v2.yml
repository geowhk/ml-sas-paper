dgp_ids:
  - dgp1
  - dgp2
  - dgp3.1
  - dgp4.3
input_dir: 02_revision-simulation/sim_dgp
output_root: 02_revision-simulation/runs/revision_v2/production
seed: 123
rf_ntree: 100
rf_mtry: 1
rf_nodesize: 1
perm_nsim: 99999
workers: 24
alpha: 0.05
mlsas_method: permute_cond
